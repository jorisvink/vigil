name: vigil
description: "Sanctum tunnels for iOS and Android, built on libkyrka."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: 7.4.2
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: fonts/ChakraPetch-Regular.ttf
          weight: 400
        - asset: fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: fonts/ChakraPetch-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
